<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قائمة الأسعار</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0B5FA5;}
  #appFrame{position:fixed;inset:0;width:100%;height:100%;border:none;display:block;background:#fff;}
  #fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
    color:#fff;font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;text-align:center;padding:20px;}
  #fallback a{color:#fff;font-weight:700;text-decoration:underline;}
  #slow{display:none;margin-top:18px;font-size:14px;}
  .loader{width:36px;height:36px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div id="fallback"><div class="loader"></div><div id="slow"></div></div>
  <iframe id="appFrame" title="app" allow="clipboard-write"></iframe>
<script>
  // رابط البرنامج على Google Apps Script (غيّره هنا بس لو عملت Deployment جديد برابط مختلف)
  var BASE_URL = "https://script.google.com/macros/s/AKfycbwlgejP7q5zNW9avL0Xy_p85dCIie9IyZDoP-mHOpX_nri0MOZYCi2q-xKPw27SlqUAfA/exec";

  function boot(){
    var search = window.location.search || '';          // بيعدّي ?item=123 وأي باراميتر للبرنامج
    var target = BASE_URL + search;
    // لوحة التحكم ممنوعة من التضمين (حماية)، فبنفتحها مباشرة بدل الـ iframe
    if(/(^|[?&])page=admin(&|$)/.test(search)){ window.location.replace(target); return; }
    var frame = document.getElementById('appFrame');
    frame.onload = function(){ document.getElementById('fallback').style.display = 'none'; };
    frame.src = target;
    setTimeout(function(){
      var s = document.getElementById('slow');
      if(document.getElementById('fallback').style.display !== 'none'){
        s.style.display = 'block';
        s.innerHTML = '<a href="' + target.replace(/"/g,'&quot;') + '" target="_top">افتح البرنامج مباشرة</a>';
      }
    }, 8000);
  }
  boot();
</script>
</body>
</html>
