<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قائمة الأسعار</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0B5FA5;}
  #appFrame{position:fixed;inset:0;width:100%;height:100%;border:none;display:block;}
  #fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:#fff;font-family:'Tajawal','Segoe UI',sans-serif;text-align:center;padding:20px;}
  #fallback a{color:#fff;font-weight:700;text-decoration:underline;margin-top:10px;display:inline-block;}
  .loader{width:34px;height:34px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;
    margin:0 auto 16px;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div id="fallback">
    <div class="loader"></div>
    <p>جارِ تحميل قائمة الأسعار...</p>
  </div>
  <iframe id="appFrame" title="قائمة الأسعار" onload="document.getElementById('fallback').style.display='none';"></iframe>
  <script>
    // الرابط الأساسي لبرنامج قائمة الأسعار (غيّره هنا لو عملت نشر جديد)
    var BASE_URL = "https://script.google.com/macros/s/AKfycbwlgejP7q5zNW9avL0Xy_p85dCIie9IyZDoP-mHOpX_nri0MOZYCi2q-xKPw27SlqUAfA/exec";
    var target = BASE_URL + window.location.search; // بينقل أي ?page=admin أو ?item=123 زي ما هي
    document.getElementById('appFrame').src = target;
    document.getElementById('fallback').innerHTML =
      '<p>جارِ تحميل قائمة الأسعار...</p><p>لو الصفحة ماتحمّلتش، <a href="'+target+'" target="_blank">دوس هنا</a>.</p>';
  </script>
</body>
</html>
